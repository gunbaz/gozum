<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Gözüm</title>
  <style>
    :root { --bg: #000; --fg: #fff; --accent: #ffd400; --muted: #9a9a9a; --warn: #ff3b30; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100%; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    h1 { margin: 0; font-size: 24px; }
    #mock { display: none; background: var(--warn); color: #fff; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
    #stage { position: relative; margin: 0 16px; border-radius: 12px; overflow: hidden; background: #111; aspect-ratio: 4 / 3; }
    #stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #say { margin: 16px; min-height: 3.2em; font-size: 24px; font-weight: 600; }
    #talk { flex: 1; min-height: 160px; margin: 0 16px; border: 4px solid var(--accent); border-radius: 16px;
      background: #111; color: var(--accent); font-size: 28px; font-weight: 800; }
    #talk.recording { background: var(--accent); color: #000; }
    .row { display: flex; gap: 8px; margin: 12px 16px; }
    .row input { flex: 1; min-width: 0; padding: 12px; font-size: 18px; border-radius: 10px; border: 2px solid #444; background: #111; color: var(--fg); }
    .row button { padding: 12px 16px; font-size: 18px; border-radius: 10px; border: 2px solid #444; background: #222; color: var(--fg); }
    details { margin: 0 16px 16px; color: var(--muted); }
    #trace { font: 13px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; max-height: 40vh; overflow: auto; }
    footer { margin: 0 16px 16px; color: var(--muted); font-size: 14px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>Gözüm</h1>
    <span id="mock" role="status">MOCK</span>
  </header>

  <div id="stage" aria-hidden="true">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <p id="say" aria-live="assertive">Başlamak için büyük düğmeye dokun.</p>

  <button id="talk" type="button">Konuşmak için dokun</button>

  <form id="typed" class="row">
    <label for="goal" class="sr">Hedef</label>
    <input id="goal" placeholder="Yazarak hedef ver (örn. çıkış kapısını bul)" autocomplete="off">
    <button type="submit">Başlat</button>
    <button id="stop" type="button">Durdur</button>
  </form>

  <details>
    <summary>Ajan izi</summary>
    <div id="trace"></div>
  </details>

  <footer>Gözüm bir yön bulma yardımcısıdır; baston, rehber köpek veya bir insanın yerine geçmez.</footer>

  <script type="module" src="app.js"></script>
</body>
</html>
